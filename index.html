<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZANVIELLE — Kayıt Testi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f5f0e6;color:#111;font-family:Arial,sans-serif}
.wrap{max-width:460px;margin:50px auto;padding:24px}
.card{background:#fff;border:1px solid #d8c9a8;padding:28px;border-radius:14px;box-shadow:0 10px 30px #0001}
h1{text-align:center;letter-spacing:3px}
input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #bbb;border-radius:8px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:8px;background:#111;color:#d9b76a;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#result{margin-top:18px;padding:13px;border-radius:8px;white-space:pre-wrap;display:none}
.ok{background:#e8f6ea;color:#155724}
.err{background:#fde8e8;color:#8a1c1c}
.small{font-size:12px;color:#666;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>ZANVIELLE</h1>
<p><b>SUPABASE KAYIT TESTİ</b></p>
<input id="name" placeholder="Ad Soyad">
<input id="email" type="email" placeholder="E-posta">
<input id="password" type="password" placeholder="Parola (en az 6 karakter)">
<button id="register">HESAP OLUŞTUR</button>
<button id="login">GİRİŞ YAP</button>
<div id="result"></div>
<div class="small">Bu sayfa yalnızca kayıt/giriş sistemini izole test etmek içindir.</div>
</div>
</div>
<script>
const SUPABASE_URL='https://ecktmtwkxnglemjketvx.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_ud2XysEjpCHjdiT0o8JHbw_KIxW50JI';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
function show(message,ok=false){
  const box=$('result');
  box.textContent=message;
  box.className=ok?'ok':'err';
  box.style.display='block';
}

$('register').addEventListener('click',async()=>{
  const name=$('name').value.trim();
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){show('E-posta ve parola zorunlu.');return}
  if(password.length<6){show('Parola en az 6 karakter olmalı.');return}
  $('register').disabled=true;
  show('Kayıt deneniyor...',true);
  try{
    const {data,error}=await client.auth.signUp({
      email,
      password,
      options:{data:{full_name:name}}
    });
    if(error) throw error;
    if(data.session){
      show('KAYIT BAŞARILI\\nOturum açıldı.\\nKullanıcı: '+data.user.email,true);
    }else{
      show('KAYIT BAŞARILI\\nSupabase e-posta doğrulaması istiyor.\\nE-postanı kontrol et.\\nKullanıcı: '+data.user.email,true);
    }
  }catch(e){
    show('SUPABASE HATASI\\n'+(e?.message||String(e)));
  }finally{$('register').disabled=false}
});

$('login').addEventListener('click',async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){show('Giriş için e-posta ve parola gir.');return}
  $('login').disabled=true;
  show('Giriş deneniyor...',true);
  try{
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error) throw error;
    show('GİRİŞ BAŞARILI\\nKullanıcı: '+data.user.email,true);
  }catch(e){
    show('SUPABASE HATASI\\n'+(e?.message||String(e)));
  }finally{$('login').disabled=false}
});
</script>
</body>
</html>
