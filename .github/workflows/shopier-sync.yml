name: Shopier API Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  test-shopier:
    runs-on: ubuntu-latest

    steps:
      - name: Shopier ürünlerini kontrol et
        env:
          SHOPIER_PAT: ${{ secrets.SHOPIER_PAT }}
        run: |
          set -e

          echo "Shopier API kontrol ediliyor..."

          RESPONSE=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${SHOPIER_PAT}" \
            "https://api.shopier.com/v1/products")

          STATUS=$(echo "$RESPONSE" | sed -n 's/.*HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP durumu: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Shopier API bağlantısı başarısız."
            echo "$BODY"
            exit 1
          fi

          echo "Shopier API bağlantısı başarılı."
          echo "$BODY" > shopier-products.json
          echo "Ürün verisi alındı."
