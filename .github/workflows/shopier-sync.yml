name: Shopier API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shopier:
    runs-on: ubuntu-latest

    steps:
      - name: Shopier API bağlantısını test et
        env:
          SHOPIER_PAT: ${{ secrets.SHOPIER_PAT }}
        run: |
          set -e

          echo "Shopier API bağlantısı kontrol ediliyor..."

          RESPONSE=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${SHOPIER_PAT}" \
            "https://api.shopier.com/v1/shop")

          STATUS=$(echo "$RESPONSE" | sed -n 's/.*HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP durumu: $STATUS"
          echo "$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "Shopier API erişimi başarısız."
            exit 1
          fi

          echo "Shopier API erişimi başarılı."
